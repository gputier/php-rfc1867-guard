name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 14 PHP minors (5.4 to 8.5), images pinned by digest in build/images.lock.
      # The digests are recorded in dist/BUILDINFO.
      - name: Build the extension for every PHP minor
        run: ./build.sh

      - name: Functional tests (built-in server, and FastCGI on 7.4 and 8.3)
        run: ./test/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.so
            dist/SHA256SUMS
            dist/BUILDINFO
          if-no-files-found: error

  install-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: install.sh on Debian + Sury, AlmaLinux + Remi, official php-fpm image
        run: ./test/install-test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, install-test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.so
            dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.so dist/SHA256SUMS dist/BUILDINFO --repo "$GITHUB_REPOSITORY" --generate-notes
